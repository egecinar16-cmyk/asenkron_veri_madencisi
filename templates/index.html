<script>

    /* =========================================================
       DEĞİŞKENLER
    ========================================================= */

    let parfumVerileri = [];

    let secilenNotalar = [];

    let mevcutSayfa = 1;

    const sayfaBasinaUrun = 10;


    /* =========================================================
       SAYFA AÇILDIĞINDA
    ========================================================= */

    document.addEventListener("DOMContentLoaded", function () {

        /*
         * API ÇEK
         */

        document
            .getElementById("cekButton")
            .addEventListener(
                "click",
                verileriCek
            );


        /*
         * NOTA BUTONLARI
         */

        document
            .querySelectorAll(".nota-btn")
            .forEach(function (button) {

                button.addEventListener(
                    "click",
                    function () {

                        const nota =
                            this.dataset.nota;


                        /*
                         * Daha önce seçiliyse
                         * seçimden kaldır.
                         */

                        if (
                            secilenNotalar
                                .includes(nota)
                        ) {

                            secilenNotalar =
                                secilenNotalar.filter(
                                    item =>
                                        item !== nota
                                );

                            this.classList.remove(
                                "secili"
                            );

                        }

                        /*
                         * Seçili değilse ekle.
                         */

                        else {

                            secilenNotalar.push(
                                nota
                            );

                            this.classList.add(
                                "secili"
                            );

                        }

                        console.log(
                            "Seçilen notalar:",
                            secilenNotalar
                        );

                    }
                );

            });


        /*
         * NOTAYA GÖRE GETİR
         */

        document
            .getElementById("filtreleButton")
            .addEventListener(
                "click",
                filtreUygula
            );


        /*
         * FİLTREYİ TEMİZLE
         */

        document
            .getElementById("temizleButton")
            .addEventListener(
                "click",
                filtreTemizle
            );


        /*
         * FİYAT SIRALAMA
         */

        document
            .getElementById("fiyatSirala")
            .addEventListener(
                "change",
                fiyatSirala
            );

    });


    /* =========================================================
       API ÇEK
    ========================================================= */

    async function verileriCek() {

        await apiIstegi([]);

    }


    /* =========================================================
       API İSTEĞİ
    ========================================================= */

    async function apiIstegi(notalar) {

        const button =
            document.getElementById(
                "cekButton"
            );

        const loading =
            document.getElementById(
                "loading"
            );

        const durum =
            document.getElementById(
                "durum"
            );


        button.disabled = true;

        loading.style.display = "block";


        durum.innerText =
            "Veriler çekiliyor, lütfen bekleyin...";


        try {

            let url = "/api/cek";


            /*
             * Nota seçildiyse API'ye gönder.
             */

            if (notalar.length > 0) {

                const eslesme =
                    document.querySelector(
                        'input[name="eslesme"]:checked'
                    ).value;


                const params =
                    new URLSearchParams();


                params.set(
                    "notalar",
                    notalar.join(",")
                );


                params.set(
                    "eslesme",
                    eslesme
                );


                url += "?" + params.toString();

            }


            console.log(
                "API isteği:",
                url
            );


            const response =
                await fetch(url);


            const data =
                await response.json();


            if (!response.ok) {

                throw new Error(
                    data.hata ||
                    "API isteği başarısız."
                );

            }


            /*
             * Gelen verileri kaydet.
             */

            parfumVerileri =
                data.veriler || [];


            /*
             * İlk sayfaya dön.
             */

            mevcutSayfa = 1;


            /*
             * İstatistikleri güncelle.
             */

            document.getElementById(
                "sayfa"
            ).innerText =

                data.basarili_sayfa +
                "/" +
                data.toplam_sayfa;


            document.getElementById(
                "urun"
            ).innerText =

                data.toplam_urun;


            document.getElementById(
                "sure"
            ).innerText =

                data.sure +
                " sn";


            durum.innerText =

                data.toplam_urun +
                " parfüm başarıyla getirildi.";


            /*
             * Tabloyu göster.
             */

            tabloyuGoster(
                parfumVerileri
            );

        }


        catch (error) {

            console.error(
                "API HATASI:",
                error
            );


            durum.innerText =
                "Hata: " +
                error.message;

        }


        button.disabled = false;

        loading.style.display = "none";

    }


    /* =========================================================
       NOTA FİLTRESİ
    ========================================================= */

    async function filtreUygula() {

        console.log(
            "Filtre uygulanıyor:",
            secilenNotalar
        );


        /*
         * Hiç nota seçilmediyse
         */

        if (
            secilenNotalar.length === 0
        ) {

            alert(
                "Lütfen en az bir nota seçin."
            );

            return;

        }


        await apiIstegi(
            secilenNotalar
        );

    }


    /* =========================================================
       FİLTREYİ TEMİZLE
    ========================================================= */

    async function filtreTemizle() {

        /*
         * Seçilen notaları sıfırla.
         */

        secilenNotalar = [];


        /*
         * Mavi butonları temizle.
         */

        document
            .querySelectorAll(".nota-btn")
            .forEach(function (button) {

                button.classList.remove(
                    "secili"
                );

            });


        /*
         * Fiyat sıralamasını varsayılana getir.
         */

        document.getElementById(
            "fiyatSirala"
        ).value = "normal";


        /*
         * Tüm verileri tekrar getir.
         */

        await verileriCek();

    }


    /* =========================================================
       FİYAT SIRALAMA
    ========================================================= */

    function fiyatSirala() {

        const secim =
            document.getElementById(
                "fiyatSirala"
            ).value;


        let siraliVeriler =
            [...parfumVerileri];


        if (secim === "dusuk") {

            siraliVeriler.sort(
                function (a, b) {

                    return (
                        Number(a.fiyat || 0) -
                        Number(b.fiyat || 0)
                    );

                }
            );

        }


        else if (secim === "yuksek") {

            siraliVeriler.sort(
                function (a, b) {

                    return (
                        Number(b.fiyat || 0) -
                        Number(a.fiyat || 0)
                    );

                }
            );

        }


        mevcutSayfa = 1;


        tabloyuGoster(
            siraliVeriler
        );

    }


    /* =========================================================
       TABLOYU GÖSTER
    ========================================================= */

    function tabloyuGoster(veriler) {

        const tablo =
            document.getElementById(
                "tablo"
            );


        if (
            !veriler ||
            veriler.length === 0
        ) {

            tablo.innerHTML = `

                <tr>

                    <td
                        colspan="6"
                        style="
                            text-align:center;
                            padding:40px;
                        ">

                        Sonuç bulunamadı.

                    </td>

                </tr>

            `;


            document.getElementById(
                "sayfalama"
            ).innerHTML = "";


            document.getElementById(
                "sayfaBilgi"
            ).innerText = "";


            return;

        }


        /*
         * Toplam sayfa.
         */

        const toplamSayfa =
            Math.ceil(
                veriler.length /
                sayfaBasinaUrun
            );


        /*
         * Sayfa sınırı.
         */

        if (
            mevcutSayfa >
            toplamSayfa
        ) {

            mevcutSayfa =
                toplamSayfa;

        }


        const baslangic =
            (mevcutSayfa - 1) *
            sayfaBasinaUrun;


        const bitis =
            baslangic +
            sayfaBasinaUrun;


        const sayfadakiVeriler =
            veriler.slice(
                baslangic,
                bitis
            );


        tablo.innerHTML = "";


        /*
         * Ürünleri oluştur.
         */

        sayfadakiVeriler.forEach(
            function (parfum, index) {

                const sira =
                    baslangic +
                    index +
                    1;


                /*
                 * FOTOĞRAF
                 */

                let gorselHTML = `

                    <div class="gorsel-yok">
                        Görsel yok
                    </div>

                `;


                if (parfum.gorsel) {

                    gorselHTML = `

                        <img
                            src="${parfum.gorsel}"
                            alt="${parfum.parfum_adi || "Parfüm"}"
                            class="urun-gorsel"
                            loading="lazy"
                            onerror="
                                this.style.display='none';
                                this.nextElementSibling.style.display='flex';
                            "
                        >

                        <div
                            class="gorsel-yok"
                            style="display:none;">

                            Görsel yüklenemedi

                        </div>

                    `;

                }


                /*
                 * FİYAT
                 */

                let fiyat = "-";


                if (
                    parfum.fiyat !== null &&
                    parfum.fiyat !== undefined
                ) {

                    fiyat =
                        Number(
                            parfum.fiyat
                        ).toLocaleString(
                            "tr-TR",
                            {
                                minimumFractionDigits: 2,
                                maximumFractionDigits: 2
                            }
                        ) +
                        " TL";

                }


                /*
                 * SATIR
                 */

                const satir =
                    document.createElement(
                        "tr"
                    );


                satir.innerHTML = `

                    <td>
                        ${sira}
                    </td>

                    <td>
                        ${gorselHTML}
                    </td>

                    <td class="parfum-adi">
                        ${parfum.parfum_adi || "-"}
                    </td>

                    <td class="notalar">
                        ${parfum.notalar || "-"}
                    </td>

                    <td class="fiyat">
                        ${fiyat}
                    </td>

                    <td class="kaynak">

                        ${
                            parfum.kaynak
                            ?
                            `<a
                                href="${parfum.kaynak}"
                                target="_blank">

                                Ürünü Aç

                            </a>`
                            :
                            "-"
                        }

                    </td>

                `;


                tablo.appendChild(
                    satir
                );

            }
        );


        /*
         * SAYFA BİLGİSİ
         */

        const ilk =
            baslangic + 1;


        const son =
            Math.min(
                bitis,
                veriler.length
            );


        document.getElementById(
            "sayfaBilgi"
        ).innerText =

            `${veriler.length} sonuçtan ` +
            `${ilk}-${son} arası gösteriliyor`;


        /*
         * SAYFALAMA
         */

        sayfalamaOlustur(
            toplamSayfa,
            veriler
        );

    }


    /* =========================================================
       SAYFALAMA
    ========================================================= */

    function sayfalamaOlustur(
        toplamSayfa,
        veriler
    ) {

        const alan =
            document.getElementById(
                "sayfalama"
            );


        alan.innerHTML = "";


        /*
         * ÖNCEKİ
         */

        const onceki =
            document.createElement(
                "button"
            );


        onceki.className =
            "sayfa-btn";


        onceki.innerText =
            "‹ Önceki";


        onceki.disabled =
            mevcutSayfa === 1;


        onceki.addEventListener(
            "click",
            function () {

                if (
                    mevcutSayfa > 1
                ) {

                    mevcutSayfa--;

                    tabloyuGoster(
                        veriler
                    );

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });

                }

            }
        );


        alan.appendChild(
            onceki
        );


        /*
         * SAYFA NUMARALARI
         */

        for (
            let i = 1;
            i <= toplamSayfa;
            i++
        ) {

            const buton =
                document.createElement(
                    "button"
                );
